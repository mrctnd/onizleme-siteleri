<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Önizleme Siteleri</title>
    <meta
      name="description"
      content="Tüm web tasarım önizlemeleri tek repository altında, her biri ayrı GitHub Pages bağlantısıyla."
    />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1f2630;
        --text: #e6edf3;
        --muted: #8b949e;
        --primary: #7cc6ff;
        --primary-2: #3fb950;
        --border: rgba(255,255,255,0.08);
        --shadow: 0 18px 30px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(124,198,255,0.16), transparent 30%),
          linear-gradient(180deg, #0b1020 0%, var(--bg) 100%);
      }

      .container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        padding: 48px 0 24px;
      }

      .title-wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.04em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        color: var(--text);
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
      }

      .badge::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary-2);
        box-shadow: 0 0 12px rgba(63,185,80,0.9);
      }

      .subtitle {
        margin-top: 12px;
        color: var(--muted);
        font-size: 1.02rem;
      }

      .layout {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        padding: 20px 0 60px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 180px;
        padding: 18px 18px 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        box-shadow: var(--shadow);
        transition: transform 0.2s ease, border-color 0.2s ease;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: rgba(124,198,255,0.45);
      }

      .card .pill {
        align-self: flex-start;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(124,198,255,0.12);
        color: var(--primary);
        font-size: 0.74rem;
        letter-spacing: 0.02em;
        border: 1px solid rgba(124,198,255,0.3);
      }

      .card h2 {
        margin: 14px 0 8px;
        font-size: 1.08rem;
        line-height: 1.4;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: opacity 0.2s ease;
      }

      .links a:hover { opacity: 0.9; }

      .links a.primary {
        color: #08131a;
        background: linear-gradient(135deg, var(--primary), #d0f0ff);
      }

      .links a.secondary {
        border: 1px solid var(--border);
        color: var(--text);
        background: rgba(255,255,255,0.02);
      }

      footer {
        padding: 0 0 40px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        header { padding-top: 28px; }
        .title-wrap { align-items: flex-start; }
      }
    </style>
  </head>
  <body>

  </body>
</html>
